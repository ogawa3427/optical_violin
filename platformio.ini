; 62 パイプライン AtomS3R 実機移植
;
;   [env:atoms3r] 実機ファーム (src/main.cpp + src/infer + src/io)
;   [env:native]  PC ネイティブ parity ハーネス (test/main_native.cpp + src/infer)
;
; 推論コア (src/infer) は Arduino 非依存の純 C++。両 env で同一ソースを共有する。


[env:m5stack-atoms3r]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I include
    -D M62_LIVE_HID
    -D M62_OUTPUT_MIDI
; build_type = debug
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
    m5stack/M5UnitSynth@^1.0.1


[env:atoms3r]
platform = espressif32
board = m5stack-atoms3            ; AtomS3R: 実機で焼けるか要確認 (plan §7-2)
framework = arduino
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.2.0
lib_deps =
    m5stack/M5Unified@^0.1.16
    m5stack/M5UnitSynth@^1.0.1
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I include
; src/ 配下 (main.cpp, infer/, io/) を全部ビルド。test/ は対象外。

; arduino-esp32 3.x を正しく解決する pioarduino プラットフォーム版。
; 既存 dataSender/soundCard の `platform = espressif32` + git core #3.2.0 は、
; この環境では framework-arduinoespressif32-libs と adc_continuous_data_t が衝突して
; ビルド不可 (dataSender でも同一エラー)。pioarduino はコアと libs が整合する。
[env:atoms3r_pioarduino]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = m5stack-atoms3
framework = arduino
lib_deps =
    m5stack/M5Unified@^0.1.16
    m5stack/M5UnitSynth@^1.0.1
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I include

[env:native]
platform = native
build_flags =
    -std=c++17
    -I include
    -I src/infer
; 推論コアと native main のみをビルド (Arduino 依存の main.cpp/io は除外)
build_src_filter =
    +<infer/>
    +<../test/main_native.cpp>
